<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>单词本</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f7;--surface:#fff;--surface2:#f9f9fb;
  --text:#1c1c1e;--text2:#636366;--text3:#aeaeb2;
  --border:#e5e5ea;--accent:#1a6af5;--accent-bg:#eef3ff;
  --radius:12px;--player-bg:#fff;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1e;--surface:#2c2c2e;--surface2:#3a3a3c;--text:#fff;--text2:#ebebf5cc;--text3:#ebebf560;--border:#38383a;--accent:#4d9fff;--accent-bg:#1a2a45;--player-bg:#2c2c2e}
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;justify-content:center;align-items:center;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{width:390px;height:844px;background:var(--surface);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.15);position:relative}
@media(max-width:440px){.app{width:100%;height:100dvh;border-radius:0}}

/* screens */
.screen{flex:1;overflow:hidden;display:flex;flex-direction:column}
.screen.hidden{display:none!important}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:0.5px solid var(--border);background:var(--surface);flex-shrink:0;min-height:52px}
.topbar h1{font-size:18px;font-weight:600;flex:1;text-align:center}
.topbar-actions{display:flex;gap:4px}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text);padding:6px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;transition:background 0.15s}
.icon-btn:hover{background:var(--surface2)}
.icon-btn.accent{color:var(--accent)}

/* shelf */
.shelf-scroll{flex:1;overflow-y:auto;padding:16px}
.shelf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.book-card{background:var(--surface2);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s}
.book-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.book-spine{width:64px;height:80px;border-radius:3px 8px 8px 3px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.book-spine::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:rgba(0,0,0,0.12);border-radius:3px 0 0 3px}
.book-spine i{font-size:26px;opacity:0.85}
.book-name{font-size:13px;font-weight:600;text-align:center;cursor:text;line-height:1.3}
.book-name:hover{text-decoration:underline;text-decoration-color:var(--text3)}
.book-count{font-size:11px;color:var(--text3)}
.add-book-card{border:1.5px dashed var(--border);border-radius:var(--radius);padding:16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--text3);min-height:140px;transition:background 0.15s,color 0.15s}
.add-book-card:hover{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.add-book-card i{font-size:28px}
.add-book-card span{font-size:12px;font-weight:500}

/* word list */
.wl-topbar{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:0.5px solid var(--border);background:var(--surface);flex-shrink:0}
.wl-title{flex:1;font-size:16px;font-weight:600;text-align:center}
.word-scroll{flex:1;overflow-y:auto}
.word-item{padding:13px 16px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background 0.1s}
.word-item:hover{background:var(--surface2)}
.word-item:active{background:var(--accent-bg)}
.w-word{font-size:16px;font-weight:600;color:var(--text)}
.w-def{font-size:13px;color:var(--text2);margin-top:3px}
.w-def .pos{color:var(--accent);font-style:italic;margin-right:4px}
.w-def.hide{display:none}
.empty-hint{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text3);padding:32px}
.empty-hint .ei-icon{font-size:48px}
.empty-hint .ei-text{font-size:15px;text-align:center;line-height:1.6}

/* player */
.player-bar{background:var(--player-bg);border-top:0.5px solid var(--border);padding:12px 16px 14px;flex-shrink:0}
.player-bar.hide{display:none}
.player-row1{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.player-info{flex:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.prog-wrap{height:3px;background:var(--border);border-radius:2px;margin-bottom:10px;cursor:pointer;position:relative}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.2s linear;pointer-events:none}
.speed-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.speed-label{font-size:11px;color:var(--text3)}
.speed-btn{padding:3px 9px;border:0.5px solid var(--border);border-radius:20px;background:none;cursor:pointer;font-size:12px;color:var(--text2);font-family:inherit;transition:all 0.15s}
.speed-btn.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}

/* modal */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(2px)}
.overlay.hide{display:none}
.modal{background:var(--surface);border-radius:16px;padding:22px 20px 18px;width:78%;max-width:300px}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px;text-align:center}
.modal input{width:100%;padding:10px 12px;border:0.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color 0.15s}
.modal input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns button{flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;border:0.5px solid var(--border);transition:opacity 0.1s}
.btn-cancel{background:var(--surface2);color:var(--text2)}
.btn-confirm{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-confirm:hover{opacity:0.85}

/* test audio button */
.test-audio-btn{width:100%;padding:10px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;border:0.5px solid var(--border);background:var(--surface2);color:var(--text);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s}
.test-audio-btn:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.test-audio-btn.testing{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.test-result{font-size:12px;text-align:center;margin-top:8px;min-height:16px}
.test-result.ok{color:#34c759}
.test-result.fail{color:#ff3b30}

/* settings modal (simplified - only audio test) */
.settings-modal-section{margin-bottom:12px}
.settings-modal-section label{display:block;font-size:12px;color:var(--text3);margin-bottom:6px;font-weight:500}
.settings-modal-section select{width:100%;padding:10px 12px;border:0.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-size:14px;font-family:inherit;outline:none}
</style>
</head>
<body>
<div class="app" id="app">

<!-- ── SHELF (词书列表) ── -->
<div class="screen" id="s-shelf">
  <div class="topbar">
    <div style="width:36px"></div>
    <h1>我的词书</h1>
    <div class="topbar-actions">
      <button class="icon-btn accent" title="设置" onclick="openSettings()"><i class="ti ti-settings"></i></button>
      <button class="icon-btn accent" title="新建词书" onclick="createBook()"><i class="ti ti-plus"></i></button>
    </div>
  </div>
  <div class="shelf-scroll">
    <div class="shelf-grid" id="shelf-grid"></div>
  </div>
</div>

<!-- ── WORD LIST ── -->
<div class="screen hidden" id="s-wordlist">
  <div class="wl-topbar">
    <button class="icon-btn" onclick="backToShelf()"><i class="ti ti-arrow-left"></i></button>
    <span class="wl-title" id="wl-title">词书</span>
    <button class="icon-btn" title="导入文件" onclick="document.getElementById('file-input').click()"><i class="ti ti-upload"></i></button>
    <input type="file" id="file-input" accept=".txt,.csv" style="display:none" onchange="importFile(this)">
    <button class="icon-btn" id="btn-eye" title="显示/隐藏释义" onclick="toggleDefs()"><i class="ti ti-eye"></i></button>
    <button class="icon-btn" id="btn-play" title="播放单词" onclick="togglePlayer()"><i class="ti ti-player-play"></i></button>
  </div>
  <div class="word-scroll" id="word-scroll"></div>
  <div class="player-bar hide" id="player-bar">
    <div class="player-row1">
      <button class="icon-btn" id="pl-playpause" onclick="playerPP()"><i class="ti ti-player-play" id="pl-icon"></i></button>
      <span class="player-info" id="pl-info">准备播放...</span>
      <button class="icon-btn" onclick="stopPlayer()"><i class="ti ti-x"></i></button>
    </div>
    <div class="prog-wrap" id="prog-wrap" onclick="seekProg(event)">
      <div class="prog-fill" id="prog-fill" style="width:0%"></div>
    </div>
    <div class="speed-row">
      <span class="speed-label">语速</span>
      <button class="speed-btn on" onclick="setSpeed(0.75,this)">0.75×</button>
      <button class="speed-btn" onclick="setSpeed(1,this)">1×</button>
      <button class="speed-btn" onclick="setSpeed(1.25,this)">1.25×</button>
      <button class="speed-btn" onclick="setSpeed(1.5,this)">1.5×</button>
    </div>
  </div>
</div>

<!-- ── SETTINGS MODAL (only audio test) ── -->
<div class="overlay hide" id="modal-settings">
  <div class="modal" style="width:85%;max-width:320px">
    <h3>发音设置</h3>
    <div class="test-result" id="storage-status" style="margin:-6px 0 10px;color:var(--text3)"></div>
    <div class="settings-modal-section">
      <label>发音引擎</label>
      <select id="audio-engine" onchange="onEngineChange()">
        <option value="online">在线发音（推荐，联网即可用）</option>
      </select>
    </div>
    <div class="settings-modal-section">
      <label>朗读内容</label>
      <select id="ss-content">
        <option value="word">仅单词</option>
        <option value="word_def" selected>单词 + 意思</option>
        <option value="word_pos_def">单词 + 词性 + 意思</option>
      </select>
    </div>
    <div class="settings-modal-section">
      <label>每词读几遍</label>
      <select id="ss-repeat">
        <option value="1" selected>1遍</option>
        <option value="2">2遍</option>
        <option value="3">3遍</option>
      </select>
    </div>
    <div class="settings-modal-section">
      <label>单词间隔</label>
      <select id="ss-interval">
        <option value="0.5">0.5秒</option>
        <option value="1" selected>1秒</option>
        <option value="1.5">1.5秒</option>
        <option value="2">2秒</option>
      </select>
    </div>
    <button class="test-audio-btn" id="test-audio-btn" onclick="testAudio()">
      <i class="ti ti-volume"></i> 测试发音
    </button>
    <div class="test-result" id="test-result"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-settings')">关闭</button>
    </div>
  </div>
</div>

<!-- modals for book -->
<div class="overlay hide" id="modal-rename">
  <div class="modal">
    <h3>重命名词书</h3>
    <input type="text" id="rename-input" placeholder="输入新名称" onkeydown="if(event.key==='Enter')confirmRename()">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-rename')">返回</button>
      <button class="btn-confirm" onclick="confirmRename()">确认</button>
    </div>
  </div>
</div>
<div class="overlay hide" id="modal-newbook">
  <div class="modal">
    <h3>新建词书</h3>
    <input type="text" id="newbook-input" placeholder="词书名称" onkeydown="if(event.key==='Enter')confirmNewBook()">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-newbook')">返回</button>
      <button class="btn-confirm" onclick="confirmNewBook()">创建</button>
    </div>
  </div>
</div>

<script>

// ── LOCAL PERSISTENCE (多级存储：localStorage → cookie → 内存) ──
var STORE_KEY = 'yuanbao_wordbook_v1';
var memStore = {};           // 最终兜底：内存（刷新仍会丢，仅保证不报错）
var storageMode = 'memory';  // 'local' | 'cookie' | 'memory'

// 探测哪种存储可用
(function detectStorage(){
  try {
    localStorage.setItem('__t', '1');
    localStorage.removeItem('__t');
    storageMode = 'local';
    return;
  } catch(e) {}
  try {
    document.cookie = '__t=1;path=/';
    if (document.cookie.indexOf('__t=1') > -1) {
      storageMode = 'cookie';
      return;
    }
  } catch(e) {}
  storageMode = 'memory';
})();

function rawSet(k, v) {
  if (storageMode === 'local') { localStorage.setItem(k, v); return true; }
  if (storageMode === 'cookie') {
    // cookie 约 4KB 限制，超大数据自动降级为内存
    if (v.length > 3500) { storageMode = 'memory'; memStore[k] = v; return false; }
    document.cookie = k + '=' + encodeURIComponent(v) + ';path=/;max-age=31536000';
    return true;
  }
  memStore[k] = v;
  return false;
}

function rawGet(k) {
  if (storageMode === 'local') return localStorage.getItem(k);
  if (storageMode === 'cookie') {
    var m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  return memStore[k] || null;
}

function saveData() {
  try {
    var data = {
      books: books.map(function(b){ return {id:b.id, name:b.name, words:b.words}; }),
      settings: {
        content: document.getElementById('ss-content').value,
        repeat: document.getElementById('ss-repeat').value,
        interval: document.getElementById('ss-interval').value
      }
    };
    rawSet(STORE_KEY, JSON.stringify(data));
  } catch(e) {}
}

function loadData() {
  try {
    var raw = rawGet(STORE_KEY);
    if (!raw) return;
    var data = JSON.parse(raw);
    if (Array.isArray(data.books) && data.books.length) {
      books = data.books.map(function(b){
        return {
          id: b.id != null ? b.id : Date.now(),
          name: String(b.name || '未命名词书'),
          words: Array.isArray(b.words) ? b.words.map(function(w){
            return {word: String(w.word||''), pos: String(w.pos||''), def: String(w.def||'')};
          }).filter(function(w){ return w.word; }) : []
        };
      });
    }
    if (data.settings) {
      if (data.settings.content) document.getElementById('ss-content').value = data.settings.content;
      if (data.settings.repeat) document.getElementById('ss-repeat').value = data.settings.repeat;
      if (data.settings.interval) document.getElementById('ss-interval').value = data.settings.interval;
    }
  } catch(e) {}
}

// 数据变化时调用（新建/重命名/导入/设置）
function _persist(){ saveData(); }

// ── STATE ──
var books = [
  {id:1, name:'示例词书', words:[
    {word:'abandon', pos:'v.', def:'放弃；遗弃'},
    {word:'abstract', pos:'adj.', def:'抽象的；深奥的'},
    {word:'accurate', pos:'adj.', def:'准确的；精确的'},
    {word:'achieve', pos:'v.', def:'实现；达到'},
    {word:'acquire', pos:'v.', def:'获得；学到'},
    {word:'adapt', pos:'v.', def:'适应；改编'},
    {word:'adequate', pos:'adj.', def:'足够的；适当的'},
    {word:'adjacent', pos:'adj.', def:'邻近的；毗连的'},
    {word:'admire', pos:'v.', def:'钦佩；赞美'},
    {word:'adventure', pos:'n.', def:'冒险；奇遇'},
  ]}
];
var curBook = null;
var renameTarget = null;
var defsVisible = true;

// ── AUDIO ENGINE (在线TTS，重写) ──
// 核心设计：
// 1. 单一 Audio 对象，顺序播放
// 2. 队列失效机制（generation token）
// 3. 自动重试（最多2次）
// 4. 英文 → 有道TTS，中文 → 有道TTS（统一用有道，稳定可靠）

var audioGen = 0;        // 队列代际号，每次新播放+1，停止时+1使旧队列失效
var audioQueue = [];     // 当前待播放URL队列
var audioIdx = 0;        // 当前播放索引
var isPlaying = false;
var isPaused = false;
var playSpeed = 0.75;
var playerActive = false;
var playerPaused = false;
var playIdx = 0;
var playerWords = [];
var playTimeout = null;

// 唯一的 Audio 对象
var audioEl = new Audio();
audioEl.preload = 'auto';

audioEl.addEventListener('ended', onAudioEnded);
audioEl.addEventListener('error', onAudioError);

var curRetry = 0;
var maxRetry = 1; // 第一次失败后重试1次

function getTTSUrl(text, lang) {
  // 英文单词 → 有道词典 dictvoice（type=2 美音，真人发音，最可靠）
  // 中文释义 → 有道翻译 fanyivoice（le=zh，专门支持中文，免费无需Key）
  // 注意：dictvoice 的 type 只支持英文音标，中文传 type=2 会返回静音，所以中文必须走 fanyivoice
  if (lang === 'zh') {
    return 'https://tts.youdao.com/fanyivoice?word=' + encodeURIComponent(text) + '&le=zh';
  }
  return 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2';
}

// 判断文本主要语言
function detectLang(text) {
  var hasEnglish = /[a-zA-Z]/.test(text);
  var hasChinese = /[\u4e00-\u9fff]/.test(text);
  if (hasEnglish && !hasChinese) return 'en';
  if (hasChinese) return 'zh';
  return 'en'; // 默认英文
}

// 播放单个URL，带重试
function playOneUrl(url, gen) {
  if (gen !== audioGen) return; // 队列已失效
  if (curRetry > maxRetry) {
    // 超过重试次数，跳过
    curRetry = 0;
    audioIdx++;
    scheduleNext(gen);
    return;
  }

  try {
    audioEl.src = url;
    audioEl.play().then(function() {
      if (gen !== audioGen) return;
      isPlaying = true;
    }).catch(function(err) {
      if (gen !== audioGen) return;
      // 播放失败，自动重试
      curRetry++;
      setTimeout(function() {
        if (gen !== audioGen) return;
        playOneUrl(url, gen);
      }, 300);
    });
  } catch(e) {
    // 异常也重试
    curRetry++;
    setTimeout(function() {
      if (gen !== audioGen) return;
      playOneUrl(url, gen);
    }, 300);
  }
}

function onAudioEnded() {
  var gen = audioGen;
  if (gen !== audioGen) return;
  curRetry = 0;
  audioIdx++;
  scheduleNext(gen);
}

function onAudioError() {
  var gen = audioGen;
  if (gen !== audioGen) return;
  curRetry++;
  if (curRetry <= maxRetry) {
    // 重试当前URL
    var url = audioQueue[audioIdx];
    if (url && gen === audioGen) {
      setTimeout(function() {
        if (gen === audioGen) playOneUrl(url, gen);
      }, 300);
    }
  } else {
    // 跳过
    curRetry = 0;
    audioIdx++;
    scheduleNext(gen);
  }
}

function scheduleNext(gen) {
  if (gen !== audioGen) return; // 队列失效，直接退出
  if (audioIdx >= audioQueue.length) {
    // 队列播完
    onQueueComplete();
    return;
  }
  var url = audioQueue[audioIdx];
  if (!url) {
    audioIdx++;
    scheduleNext(gen);
    return;
  }
  curRetry = 0;
  playOneUrl(url, gen);
}

function onQueueComplete() {
  isPlaying = false;
  // 通知外部（播放器模式）
  if (playerActive && playerCallback) {
    playerCallback();
  }
}

var playerCallback = null; // 播放完一个单词所有内容后的回调

// 播放一个单词（点击时调用）
function speakWord(w) {
  // 立即停止之前的队列，创建新队列
  stopAllAudio();
  var gen = audioGen; // 当前代际号（stopAllAudio 已递增）

  var content = document.getElementById('ss-content').value;
  var urls = [];

  // 英文单词发音
  urls.push(getTTSUrl(w.word, 'en'));

  if (content.indexOf('pos') > -1 && w.pos) {
    // 词性用中文读
    urls.push(getTTSUrl(w.pos.replace(/\./g, ''), 'zh'));
  }
  if (content.indexOf('def') > -1 && w.def) {
    urls.push(getTTSUrl(w.def, 'zh'));
  }

  audioQueue = urls;
  audioIdx = 0;
  curRetry = 0;

  scheduleNext(gen);
}

// 播放一个单词的全部内容（播放器模式）
function speakWordForPlayer(w, done) {
  var gen = audioGen;
  var content = document.getElementById('ss-content').value;
  var repeat = parseInt(document.getElementById('ss-repeat').value) || 1;
  var urls = [];

  for (var r = 0; r < repeat; r++) {
    urls.push(getTTSUrl(w.word, 'en'));
    if (content.indexOf('pos') > -1 && w.pos) {
      urls.push(getTTSUrl(w.pos.replace(/\./g, ''), 'zh'));
    }
    if (content.indexOf('def') > -1 && w.def) {
      urls.push(getTTSUrl(w.def, 'zh'));
    }
  }

  if (urls.length === 0) {
    done();
    return;
  }

  // 替换当前队列
  audioQueue = urls;
  audioIdx = 0;
  curRetry = 0;
  playerCallback = function() {
    playerCallback = null;
    if (gen === audioGen) done();
  };

  scheduleNext(gen);
}

function stopAllAudio() {
  // 使所有旧队列立即失效
  audioGen++;
  try {
    audioEl.pause();
    audioEl.currentTime = 0;
  } catch(e) {}
  isPlaying = false;
  curRetry = 0;
  clearTimeout(playTimeout);
}

// ── PLAYER (播放器模式) ──
function togglePlayer() {
  if (playerActive) { stopPlayer(); return; }
  if (!curBook || !curBook.words.length) return;

  playerWords = curBook.words.slice();
  playIdx = 0;
  playerActive = true;
  playerPaused = false;
  document.getElementById('player-bar').classList.remove('hide');
  document.getElementById('btn-play').querySelector('i').className = 'ti ti-player-stop';
  document.getElementById('pl-icon').className = 'ti ti-player-pause';
  playNextWord();
}

function stopPlayer() {
  playerActive = false;
  playerPaused = false;
  stopAllAudio();
  document.getElementById('player-bar').classList.add('hide');
  document.getElementById('btn-play').querySelector('i').className = 'ti ti-player-play';
  document.getElementById('prog-fill').style.width = '0%';
  document.getElementById('pl-info').textContent = '准备播放...';
}

function playerPP() {
  if (!playerActive) return;
  if (playerPaused) {
    // 恢复
    playerPaused = false;
    document.getElementById('pl-icon').className = 'ti ti-player-pause';
    if (isPlaying === false && audioIdx < audioQueue.length) {
      // 被暂停了，重新播放当前
      var gen = audioGen;
      scheduleNext(gen);
    } else {
      audioEl.play().catch(function(){});
    }
  } else {
    // 暂停
    playerPaused = true;
    document.getElementById('pl-icon').className = 'ti ti-player-play';
    audioEl.pause();
  }
}

function playNextWord() {
  if (!playerActive) return;
  if (playIdx >= playerWords.length) { stopPlayer(); return; }

  var w = playerWords[playIdx];
  var pct = Math.round((playIdx / playerWords.length) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('pl-info').textContent = (playIdx + 1) + '/' + playerWords.length + ' — ' + w.word;

  speakWordForPlayer(w, function() {
    if (!playerActive) return;
    playIdx++;
    var interval = parseFloat(document.getElementById('ss-interval').value) || 1;
    playTimeout = setTimeout(playNextWord, interval * 1000);
  });
}

function setSpeed(s, el) {
  playSpeed = s;
  document.querySelectorAll('.speed-btn').forEach(function(b) { b.classList.remove('on'); });
  el.classList.add('on');
}

function seekProg(e) {
  var rect = document.getElementById('prog-wrap').getBoundingClientRect();
  var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  playIdx = Math.floor(pct * playerWords.length);
  stopAllAudio();
  clearTimeout(playTimeout);
  if (playerActive) playNextWord();
}

// ── IMPORT ──
function importFile(inp) {
  var file = inp.files[0]; if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'txt' || ext === 'csv') {
    var r = new FileReader();
    r.onload = function(e) { parseTxt(e.target.result); };
    r.readAsText(file, 'UTF-8');
  } else {
    alert('暂仅支持 .txt 文件\n格式示例：\napple n. 苹果');
  }
  inp.value = '';
}

function parseTxt(text) {
  var lines = text.split('\n').filter(function(l) { return l.trim(); });
  var words = [];
  lines.forEach(function(line) {
    line = line.trim(); if (!line) return;
    // 尝试匹配: word pos def
    var m = line.match(/^(.+?)\s+(n\.|v\.|adj\.|adv\.|prep\.|conj\.|pron\.|int\.|art\.|num\.|vt\.|vi\.|abbr\.)\s+(.+)$/);
    if (m) {
      words.push({word: m[1].trim(), pos: m[2].trim(), def: m[3].trim()});
    } else {
      // 简单分割：第一个空格前是单词
      var idx = line.search(/\s+/);
      if (idx > 0) {
        words.push({word: line.slice(0, idx), pos: '', def: line.slice(idx).trim()});
      } else {
        words.push({word: line, pos: '', def: ''});
      }
    }
  });
  if (words.length) addWords(words);
  else alert('未能解析出单词，请检查文件格式');
}

function addWords(ws) {
  if (!curBook) return;
  curBook.words = curBook.words.concat(ws);
  saveData();
  renderWordList();
  renderShelf();
}

// 测试发音 — 验证网络通道是否通畅
function testAudio() {
  var btn = document.getElementById('test-audio-btn');
  var result = document.getElementById('test-result');
  btn.classList.add('testing');
  btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> 测试中...';
  result.textContent = '正在通过有道TTS测试英文发音...';
  result.className = 'test-result';

  // 加一个旋转动画
  if (!document.getElementById('spin-style')) {
    var style = document.createElement('style');
    style.id = 'spin-style';
    style.textContent = '@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}';
    document.head.appendChild(style);
  }

  var testGen = audioGen + 1; // 不干扰当前播放

  // 测试英文：有道TTS
  var enUrl = getTTSUrl('hello', 'en');
  var enAudio = new Audio();
  enAudio.src = enUrl;

  var enOk = false;
  var zhOk = false;
  var finished = 0;

  function checkDone() {
    finished++;
    if (finished >= 2) {
      btn.classList.remove('testing');
      if (enOk && zhOk) {
        btn.innerHTML = '<i class="ti ti-volume"></i> 测试发音';
        result.textContent = '✓ 英文 + 中文 通道均正常（有道TTS）';
        result.className = 'test-result ok';
      } else if (enOk) {
        btn.innerHTML = '<i class="ti ti-volume"></i> 测试发音';
        result.textContent = '⚠ 英文通道正常，中文通道可能受限（单词仍可正常发音）';
        result.className = 'test-result ok';
      } else {
        btn.innerHTML = '<i class="ti ti-volume"></i> 测试发音';
        result.textContent = '✗ 网络通道异常，请检查网络连接';
        result.className = 'test-result fail';
      }
    }
  }

  // 测试英文
  enAudio.addEventListener('canplay', function() { enOk = true; });
  enAudio.addEventListener('loadeddata', function() { enOk = true; });
  enAudio.addEventListener('playing', function() { enOk = true; });
  enAudio.addEventListener('error', function() {});
  enAudio.addEventListener('ended', function() { enOk = true; checkDone(); });

  enAudio.play().then(function() {
    enOk = true;
    // 播放成功后再测中文
    setTimeout(function() {
      result.textContent = '英文通道OK，正在测试中文(有道TTS)...';
      var zhUrl = getTTSUrl('测试', 'zh');
      var zhAudio = new Audio();
      zhAudio.src = zhUrl;
      zhAudio.addEventListener('canplay', function() { zhOk = true; });
      zhAudio.addEventListener('loadeddata', function() { zhOk = true; });
      zhAudio.addEventListener('playing', function() { zhOk = true; });
      zhAudio.addEventListener('error', function() {});
      zhAudio.addEventListener('ended', function() { zhOk = true; checkDone(); });
      zhAudio.play().then(function() {
        zhOk = true;
        setTimeout(checkDone, 1500);
      }).catch(function() {
        // 有道TTS可能CORS限制，但如果有声音也算OK
        setTimeout(function() {
          // 即使play promise reject，浏览器也可能已经发出声音
          checkDone();
        }, 2000);
      });
      setTimeout(checkDone, 4000); // 总超时4秒
    }, 500);
  }).catch(function() {
    // 英文也失败
    setTimeout(function() {
      // 直接测中文
      result.textContent = '正在尝试中文通道...';
      var zhUrl2 = getTTSUrl('测试', 'zh');
      var zhAudio2 = new Audio();
      zhAudio2.src = zhUrl2;
      zhAudio2.addEventListener('playing', function() { zhOk = true; });
      zhAudio2.addEventListener('error', function() {});
      zhAudio2.play().then(function() { zhOk = true; }).catch(function() {});
      setTimeout(function() {
        btn.classList.remove('testing');
        if (zhOk) {
          btn.innerHTML = '<i class="ti ti-volume"></i> 测试发音';
          result.textContent = '⚠ 英文通道受限，中文通道正常（单词可能只能读中文释义）';
          result.className = 'test-result ok';
        } else {
          btn.innerHTML = '<i class="ti ti-volume"></i> 测试发音';
          result.textContent = '✗ 网络通道异常，请检查网络连接';
          result.className = 'test-result fail';
        }
      }, 3000);
    }, 500);
  });

  // 总超时保护（8秒）
  setTimeout(function() {
    if (btn.classList.contains('testing')) {
      btn.classList.remove('testing');
      btn.innerHTML = '<i class="ti ti-volume"></i> 测试发音';
      if (enOk) {
        result.textContent = '✓ 英文(有道)通道正常，中文通道超时（英文单词可正常发音）';
        result.className = 'test-result ok';
      } else {
        result.textContent = '✗ 测试超时，请检查网络连接';
        result.className = 'test-result fail';
      }
    }
  }, 8000);
}
